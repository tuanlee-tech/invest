<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Sự Kiện & Tin Tức</h1>
    <div class="flex space-x-2">
        <button onclick="fetchLatestNews()" class="btn btn-primary">Thu Thập Tin Tức Mới</button>
        <select id="filter-event-type" class="input w-auto" onchange="loadEvents()">
            <option value="">Tất cả loại tin</option>
            <option value="news">Tin tức / Báo chí</option>
            <option value="macro">Kinh tế vĩ mô</option>
            <option value="disclosure">Công bố thông tin</option>
            <option value="corporate_action">Sự kiện doanh nghiệp</option>
        </select>
        <input type="text" id="filter-event-ticker" class="input w-32 uppercase" placeholder="Lọc theo mã" onkeyup="if(event.key==='Enter') loadEvents()">
    </div>
</div>

<div class="card">
    <div class="p-6">
        <div id="events-full-list" class="space-y-4"></div>
    </div>
</div>

<script>
async function loadEvents() {
    const type = document.getElementById('filter-event-type').value;
    const ticker = document.getElementById('filter-event-ticker').value.toUpperCase();
    let url = '/api/events?limit=50';
    if (type) url += `&source_type=${type}`;
    if (ticker) url += `&ticker=${ticker}`;
    
    try {
        const events = await fetch(url).then(r => r.json());
        const listDiv = document.getElementById('events-full-list');
        listDiv.innerHTML = events.map(e => `
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-100 hover:border-indigo-200 transition-colors">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="badge ${e.classification === 'FACT' ? 'badge-buy' : 'badge-watch'}">${e.classification}</span>
                            <span class="text-xs text-gray-500">${e.source_name}</span>
                            <span class="text-xs text-gray-400">•</span>
                            <span class="text-xs text-gray-500">${new Date(e.occurred_at).toLocaleString('vi-VN')}</span>
                        </div>
                        <h3 class="font-semibold text-gray-900 mt-1">
                            <a href="${e.source_url}" target="_blank" class="hover:text-indigo-600">${e.headline}</a>
                        </h3>
                    </div>
                </div>
                <div class="text-sm text-gray-600 mt-2">${e.summary || ''}</div>
                
                ${e.causal_links && e.causal_links.length ? `
                    <div class="mt-3 pt-3 border-t border-gray-200">
                        <p class="text-xs font-semibold text-gray-500 uppercase mb-1">Chuỗi Tác Động Suy Luận (Causal Chain):</p>
                        <div class="space-y-1">
                            ${e.causal_links.map(c => `
                                <div class="text-xs bg-white p-2 rounded border border-gray-100 flex items-center justify-between">
                                    <span>
                                        <strong class="font-mono">${c.target_ticker}</strong>: 
                                        <span class="${c.direction === 'POSITIVE' ? 'text-green-600' : 'text-red-600'} font-medium">
                                            ${c.direction === 'POSITIVE' ? 'Hưởng lợi' : 'Thiệt hại'}
                                        </span> 
                                        — ${c.mechanism}
                                    </span>
                                    <span class="text-gray-400 font-mono">${c.confidence}% tin cậy</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}

                <div class="flex flex-wrap gap-1 mt-3">
                    ${(e.entities || []).map(t => `<span class="badge badge-watch text-xs">${t}</span>`).join('')}
                </div>
            </div>
        `).join('') || '<p class="text-gray-500 text-center py-8">Chưa có sự kiện nào</p>';
    } catch (e) {
        console.error(e);
    }
}

async function fetchLatestNews() {
    alert('Đang thu thập tin tức từ RSS... (Ingestion Engine)');
}

loadEvents();
</script>
