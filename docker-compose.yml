services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Host OpenCode CLI + config so free-model LLM jobs work inside the container.
      # Config path matches the container user's HOME (/home/appuser).
      - /home/vcc/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - /home/vcc/.config/opencode:/home/appuser/.config/opencode:ro
    environment:
      OPENCODE_BIN: /usr/local/bin/opencode
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).status==200 else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s
